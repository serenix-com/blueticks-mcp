# DO NOT push v* tags until the registry job's DNS login lands (see the issue on
# this repo "publish.yml registry job needs DNS auth for co.blueticks/*"). A tag
# push runs npm publish and then fails at the registry login.
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      registry_only:
        description: 'Only publish server.json to the MCP Registry (skip the npm publish)'
        type: boolean
        default: false

# OIDC trusted publishing (npm) — no long-lived token. The trust is configured
# on the npmjs '@blueticks/mcp' package (Settings → Trusted Publisher) for this
# repo + workflow + the 'npm' environment. Requires npm >= 11.5.1 for OIDC.
# Tool-defs are vendored (src/tool-defs), so the build is self-contained — no
# private submodule to fetch.
permissions:
  id-token: write
  contents: read

env:
  # Pinned deliberately; the archive is verified with cosign below. Bump on purpose.
  MCP_PUBLISHER_VERSION: v1.8.7

jobs:
  publish:
    if: ${{ !inputs.registry_only }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@blueticks/mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --run
      - run: npm publish --access public

  # NOTE: server.json is now named co.blueticks/blueticks, which needs DNS auth
  # (mcp-publisher login dns), not github-oidc; this job's login step below still
  # uses github-oidc and will fail for that name until it is changed (op: DNS key).
  # Publishes server.json to the official MCP Registry. The io.github.serenix-com/*
  # namespace is an org namespace, so it needs GitHub Actions OIDC; the interactive
  # `mcp-publisher login github` gets a 403. No secret is used here.
  registry:
    needs: publish
    if: ${{ always() && (needs.publish.result == 'success' || inputs.registry_only) }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check server.json matches package.json
        run: |
          set -euo pipefail
          v="$(jq -r .version package.json)"
          test "$(jq -r .version server.json)" = "$v"
          # server.json is remote-only under co.blueticks/blueticks; no packages entry,
          # so packages[0].version and package.json mcpName are not checked.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - run: ./mcp-publisher login github-oidc
      - run: ./mcp-publisher publish
