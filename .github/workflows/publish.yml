# A v* tag publishes to npm only. The MCP Registry job is skipped on tag pushes; run it
# by hand with workflow_dispatch + registry_only (DNS auth wired, #1528).
name: Publish to npm

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      registry_only:
        description: 'Only publish server.json to the MCP Registry (skip the npm publish)'
        type: boolean
        default: false

# OIDC trusted publishing (npm) — no long-lived token. The trust is configured
# on the npmjs '@blueticks/mcp' package (Settings → Trusted Publisher) for this
# repo + workflow + the 'npm' environment. Requires npm >= 11.5.1 for OIDC.
# Tool-defs are vendored (src/tool-defs), so the build is self-contained — no
# private submodule to fetch.
permissions:
  id-token: write
  contents: read

env:
  # Pinned deliberately; the archive is verified with cosign below. Bump on purpose.
  MCP_PUBLISHER_VERSION: v1.8.7

jobs:
  publish:
    if: ${{ !inputs.registry_only }}
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@blueticks/mcp
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test -- --run
      - run: npm publish --access public

  # Publishes server.json (co.blueticks/blueticks) to the official MCP Registry using
  # DNS auth: the ed25519 public key is in the blueticks.co TXT record (v=MCPv1), the
  # private key (hex seed) is the MCP_REGISTRY_PRIVATE_KEY repo secret.
  registry:
    # Skipped on tag pushes so a failing registry login can never block or fail the npm
    # release. Re-enable the tag trigger (`needs.publish.result == 'success'`) once the
    # DNS login below has been proven by a manual registry_only run (#1528).
    needs: publish
    if: ${{ always() && inputs.registry_only == true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - name: Check server.json matches package.json
        run: |
          set -euo pipefail
          v="$(jq -r .version package.json)"
          test "$(jq -r .version server.json)" = "$v"
          # server.json is remote-only under co.blueticks/blueticks; no packages entry,
          # so packages[0].version and package.json mcpName are not checked.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          archive="mcp-publisher_linux_amd64.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
      - name: Log in to the MCP Registry (DNS auth)
        env:
          MCP_REGISTRY_PRIVATE_KEY: ${{ secrets.MCP_REGISTRY_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$MCP_REGISTRY_PRIVATE_KEY"
          ./mcp-publisher login dns --domain blueticks.co --private-key "$MCP_REGISTRY_PRIVATE_KEY"
      - run: ./mcp-publisher publish
